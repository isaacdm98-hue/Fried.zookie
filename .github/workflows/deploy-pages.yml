name: Deploy PWA to GitHub Pages

# Builds the static PWA and publishes it to GitHub Pages, giving an installable
# URL (https://<owner>.github.io/Fried.zookie/).
#
# ONE-TIME SETUP (required, owner only): repo Settings → Pages → "Build and
# deployment" → Source = "GitHub Actions". The Actions token cannot enable Pages
# itself, so until that switch is flipped the deploy step has nothing to publish to.
#
# This runs ONLY on manual trigger (Actions tab → "Deploy PWA to GitHub Pages" →
# Run workflow), so ordinary pushes never produce a failed run. Once Pages is
# enabled, run it once and it will publish — and stay published on each manual run.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci || npm install
      - name: Build production bundle + service worker
        run: npm run build
      - name: Assemble the static site
        run: |
          mkdir -p _site
          cp index.html friedzooki.bundle.js sw.js theme.css manifest.webmanifest _site/
          cp -r assets icons _site/
          # Aqau Pluto — the Gemma 4 vibe-coding studio PWA (served at /aqau-pluto/)
          cp -r aqau-pluto _site/aqau-pluto
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
